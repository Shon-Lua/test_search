<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Music Search</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #121212;
        color: #fff;
        min-height: 100vh;
    }
    header {
        background: #000;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        gap: 24px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .logo {
        font-weight: 700;
        font-size: 20px;
        color: #1db954;
        letter-spacing: -0.5px;
    }
    .search-wrap {
        flex: 1;
        max-width: 500px;
        position: relative;
    }
    input {
        width: 100%;
        padding: 12px 44px 12px 18px;
        font-size: 14px;
        border-radius: 500px;
        border: none;
        background: #242424;
        color: #fff;
        outline: none;
        transition: background 0.2s;
    }
    input:focus { background: #2a2a2a; }
    input::placeholder { color: #a7a7a7; }
    .search-btn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: #1db954;
        color: #000;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .search-btn:hover { background: #1ed760; }

    main { padding: 24px 32px 120px; }

    .status {
        color: #a7a7a7;
        font-size: 14px;
        padding: 8px 0 16px;
    }
    .status.error { color: #f15e6c; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
    }

    .card {
        background: #181818;
        border-radius: 8px;
        padding: 16px;
        cursor: pointer;
        transition: background 0.2s;
        position: relative;
    }
    .card:hover { background: #282828; }

    .cover-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 6px;
        overflow: hidden;
        margin-bottom: 14px;
        background: #2a2a2a;
        box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .cover-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .play-overlay {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #1db954;
        border: none;
        color: #000;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.2s;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    .card:hover .play-overlay,
    .card.playing .play-overlay {
        opacity: 1;
        transform: translateY(0);
    }
    .play-overlay:hover { transform: scale(1.06) !important; background: #1ed760; }

    .title {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
    }
    .artist {
        font-size: 13px;
        color: #a7a7a7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .card.playing .title { color: #1db954; }

    .player {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 90px;
        background: #181818;
        border-top: 1px solid #282828;
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 20px;
        z-index: 20;
    }
    .player-cover {
        width: 56px;
        height: 56px;
        border-radius: 4px;
        background: #2a2a2a;
        object-fit: cover;
        flex-shrink: 0;
    }
    .player-info {
        width: 200px;
        flex-shrink: 0;
        overflow: hidden;
    }
    .player-info .t {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .player-info .a {
        font-size: 12px;
        color: #a7a7a7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    audio {
        flex: 1;
        height: 40px;
        filter: invert(0.9) hue-rotate(90deg);
    }
    .empty-player { color: #6a6a6a; font-size: 14px; }

    @media (max-width: 640px) {
        header { padding: 12px 16px; gap: 12px; }
        main { padding: 16px 16px 120px; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
        .player-info { width: 120px; }
    }
</style>
</head>
<body>

<header>
    <div class="logo">Music</div>
    <div class="search-wrap">
        <input id="query" placeholder="Трек, исполнитель..."
               onkeydown="if(event.key==='Enter') search()">
        <button class="search-btn" onclick="search()">🔍</button>
    </div>
</header>

<main>
    <div id="status" class="status">Введите запрос и нажмите Enter</div>
    <div id="results" class="grid"></div>
</main>

<div class="player" id="player">
    <img class="player-cover" id="playerCover" alt="" style="visibility:hidden">
    <div class="player-info">
        <div class="t" id="playerTitle"><span class="empty-player">Ничего не играет</span></div>
        <div class="a" id="playerArtist"></div>
    </div>
    <audio id="audio" controls preload="none"></audio>
</div>

<script>
const AUDIUS_HOST = "https://discoveryprovider.audius.co";
const APP_NAME = "Flock3Plus";
const LIMIT = 30;

const audioEl = document.getElementById("audio");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const playerCover = document.getElementById("playerCover");
const playerTitle = document.getElementById("playerTitle");
const playerArtist = document.getElementById("playerArtist");

let currentCard = null;

audioEl.addEventListener("ended", () => {
    if (currentCard) currentCard.classList.remove("playing");
    currentCard = null;
});

function setStatus(text, isError = false) {
    statusEl.textContent = text;
    statusEl.className = "status" + (isError ? " error" : "");
}

function playTrack(track, card) {
    if (currentCard === card && !audioEl.paused) {
        audioEl.pause();
        card.classList.remove("playing");
        return;
    }

    if (currentCard && currentCard !== card) {
        currentCard.classList.remove("playing");
    }

    audioEl.pause();
    audioEl.src = `${AUDIUS_HOST}/v1/tracks/${track.id}/stream?app_name=${APP_NAME}`;
    audioEl.play().catch(e => setStatus("Ошибка воспроизведения: " + e.message, true));

    currentCard = card;
    card.classList.add("playing");

    const cover = track.artwork?.["480x480"] || track.artwork?.["150x150"] || "";
    if (cover) {
        playerCover.src = cover;
        playerCover.style.visibility = "visible";
    } else {
        playerCover.style.visibility = "hidden";
    }
    playerTitle.textContent = track.title || "Без названия";
    playerArtist.textContent = track.user?.name || "Unknown";
}

async function search() {
    const q = document.getElementById("query").value.trim();
    if (!q) {
        setStatus("Введите запрос", true);
        return;
    }

    setStatus("Ищу...");
    resultsEl.innerHTML = "";

    const url = `${AUDIUS_HOST}/v1/tracks/search?query=${encodeURIComponent(q)}&limit=${LIMIT}&app_name=${APP_NAME}`;

    let data;
    try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        data = await resp.json();
    } catch (e) {
        setStatus("Ошибка: " + e.message, true);
        return;
    }

    const tracks = data.data || [];
    if (!tracks.length) {
        setStatus("Ничего не найдено.");
        return;
    }

    setStatus(`Найдено треков: ${tracks.length}`);
    resultsEl.innerHTML = "";

    for (const track of tracks) {
        const cover = track.artwork?.["480x480"] || track.artwork?.["150x150"] || "";
        const title = track.title || "Без названия";
        const artist = track.user?.name || "Unknown";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="cover-wrap">
                ${cover ? `<img src="${cover}" alt="" loading="lazy">` : ""}
                <button class="play-overlay">▶</button>
            </div>
            <div class="title">${escapeHtml(title)}</div>
            <div class="artist">${escapeHtml(artist)}</div>
        `;

        card.addEventListener("click", () => playTrack(track, card));
        resultsEl.appendChild(card);
    }
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
}
</script>

</body>
</html>
