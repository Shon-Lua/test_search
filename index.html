
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lib Club Manga</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#1b1c24;--line:#30313d;--text:#f5f5fa;--muted:#a6a7b5;--accent:#c5a4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}
header{padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101116f2;z-index:2}
nav,main{max-width:1100px;margin:auto}
nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:21px;font-weight:800;margin-right:auto}
.logo span{color:var(--accent)}
input,select,button{font:inherit;border-radius:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
input{min-width:0;flex:1}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:#21182e;font-weight:700}
main{padding:24px 18px 60px}
h1{font-size:clamp(25px,4vw,36px);margin:0 0 18px}
h2{font-size:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
#status,#debug{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:15px 0;overflow-wrap:anywhere}
#error{color:#ff9d9d}
#debug{white-space:pre-wrap;font:12px ui-monospace,monospace;color:#c4c5d2;max-height:280px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}
.card{cursor:pointer;min-width:0}
.cover{width:100%;aspect-ratio:3/4.2;object-fit:cover;background:var(--panel);border-radius:10px}
.card strong{display:block;margin-top:8px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.detail{display:grid;grid-template-columns:180px 1fr;gap:22px}
.detail img{width:100%;border-radius:12px}
.chapters{display:grid;gap:8px;margin-top:15px}
.chapters button{text-align:left}
#pages img{display:block;width:100%;max-width:850px;height:auto;margin:0 auto 5px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:560px){.detail{grid-template-columns:110px 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<nav>
<div class="logo">Lib Club <span>Manga</span></div>
<input id="search" placeholder="Название манги">
<button class="primary" id="searchBtn">Найти</button>
</nav>
</header>
<main>
<section id="catalogView">
<h1 id="heading">Каталог манги</h1>
<div class="row">
<label for="language">Язык:</label>
<select id="language">
<option value="auto">Автоматически</option>
<option value="ru">Русский</option>
<option value="en">English</option>
<option value="uk">Українська</option>
<option value="ja">日本語</option>
</select>
<button id="reload">Обновить</button>
</div>
<div id="status">Подготовка запроса…</div>
<div id="debug"></div>
<div class="grid" id="catalog"></div>
<div class="row"><button id="more" class="hidden">Загрузить ещё</button></div>
</section>

<section id="detailView" class="hidden">
<button id="back">← Каталог</button>
<div id="detail"></div>
<h2>Главы</h2>
<div class="row">
<label for="chapterLang">Язык глав:</label>
<select id="chapterLang">
<option value="auto">Как в каталоге</option>
<option value="ru">Русский</option>
<option value="en">English</option>
<option value="uk">Українська</option>
<option value="ja">日本語</option>
</select>
</div>
<div id="chapterStatus" class="muted"></div>
<div class="chapters" id="chapters"></div>
</section>

<section id="readerView" class="hidden">
<button id="readerBack">← К главам</button>
<h2 id="readerTitle">Читалка</h2>
<div id="readerStatus" class="muted"></div>
<div id="pages"></div>
</section>
</main>
<script>
const API="https://api.mangadex.org";
const $=id=>document.getElementById(id);
const state={offset:0,limit:20,search:"",language:"ru",manga:null,chapters:[],mangaId:null};
let requestNumber=0;

function detectLanguage(text=""){
 if(/[іїєґІЇЄҐ]/.test(text))return"uk";
 if(/[а-яёА-ЯЁ]/.test(text))return"ru";
 if(/[a-zA-Z]/.test(text))return"en";
 const lang=(navigator.language||"ru").toLowerCase();
 if(lang.startsWith("uk"))return"uk";
 if(lang.startsWith("ja"))return"ja";
 if(lang.startsWith("ru"))return"ru";
 return"en";
}

function currentLanguage(){
 return $("language").value==="auto"?detectLanguage($("search").value):$("language").value;
}

function chapterLanguage(){
 return $("chapterLang").value==="auto"?state.language:$("chapterLang").value;
}

function log(message){
 const time=new Date().toLocaleTimeString();
 $("debug").textContent=`[${time}] ${message}\n`+$("debug").textContent;
}

function status(message,error=false){
 $("status").textContent=message;
 $("status").style.color=error?"#ff9d9d":"";
}

function show(view){
 $("catalogView").classList.toggle("hidden",view!=="catalog");
 $("detailView").classList.toggle("hidden",view!=="detail");
 $("readerView").classList.toggle("hidden",view!=="reader");
 window.scrollTo(0,0);
}

function titleOf(manga){
 const titles=manga.attributes?.title||{};
 return titles[state.language]||titles.en||titles.ja||Object.values(titles)[0]||"Без названия";
}

function coverOf(manga){
 const cover=(manga.relationships||[]).find(r=>r.type==="cover_art");
 if(!cover?.attributes?.fileName)return"";
 return `https://uploads.mangadex.org/covers/${manga.id}/${encodeURIComponent(cover.attributes.fileName)}.256.jpg`;
}

async function request(path,params={}){
 const query=new URLSearchParams();
 for(const [key,value] of Object.entries(params)){
  if(Array.isArray(value))value.forEach(v=>query.append(key,v));
  else if(value!==undefined&&value!==null&&value!=="")query.set(key,value);
 }
 const url=API+path+(query.size?"?"+query.toString():"");
 log("GET "+url);
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),20000);
 try{
  const response=await fetch(url,{method:"GET",headers:{Accept:"application/json"},signal:controller.signal});
  log("HTTP "+response.status+" "+url);
  const text=await response.text();
  let json;
  try{json=JSON.parse(text)}catch{throw new Error("Ответ не является JSON. HTTP "+response.status)}
  if(!response.ok)throw new Error("HTTP "+response.status+": "+(json.errors?.[0]?.detail||json.message||"ошибка API"));
  return json;
 }catch(error){
  if(error.name==="AbortError")throw new Error("Тайм-аут запроса");
  if(error instanceof TypeError){
   throw new Error("Браузер не разрешил прочитать ответ. Возможна блокировка CORS или сетевая ошибка. Открой DevTools → Console для уточнения.");
  }
  throw error;
 }finally{
  clearTimeout(timer);
 }
}

function addCard(manga){
 const card=document.createElement("article");
 card.className="card";
 const img=document.createElement("img");
 img.className="cover";
 img.loading="lazy";
 img.alt=titleOf(manga);
 img.src=coverOf(manga);
 img.onerror=()=>{img.removeAttribute("src");img.alt="Обложка недоступна"};
 const name=document.createElement("strong");
 name.textContent=titleOf(manga);
 const sub=document.createElement("div");
 sub.className="muted";
 sub.textContent=manga.attributes?.status||"";
 card.append(img,name,sub);
 card.onclick=()=>openManga(manga.id);
 $("catalog").append(card);
}

async function loadCatalog(reset=true){
 const id=++requestNumber;
 state.language=currentLanguage();
 if(reset){
  state.offset=0;
  $("catalog").replaceChildren();
 }
 $("more").classList.add("hidden");
 status("Выполняется запрос к MangaDex…");
 const params={
  limit:state.limit,
  offset:state.offset,
  "contentRating[]":["safe","suggestive"],
  "availableTranslatedLanguage[]":[state.language],
  "includes[]":["cover_art"],
  "order[followedCount]":"desc"
 };
 if(state.search)params.title=state.search;
 try{
  const result=await request("/manga",params);
  if(id!==requestNumber)return;
  const items=result.data||[];
  items.forEach(addCard);
  state.offset+=items.length;
  status(`Получено объектов: ${items.length}. Язык: ${state.language}. Всего по ответу: ${result.total??"не указано"}.`);
  $("more").classList.toggle("hidden",items.length<state.limit);
  if(!items.length&&reset)$("catalog").textContent="Ничего не найдено.";
 }catch(error){
  if(id!==requestNumber)return;
  status(error.message,true);
  log("ERROR "+error.message);
 }
}

async function openManga(id){
 state.mangaId=id;
 state.chapters=[];
 $("detail").replaceChildren();
 $("chapters").replaceChildren();
 $("chapterStatus").textContent="Загрузка информации о манге…";
 show("detail");
 try{
  const result=await request("/manga/"+encodeURIComponent(id),{"includes[]":["cover_art","author","artist"]});
  state.manga=result.data;
  const manga=state.manga;
  const wrap=document.createElement("div");
  wrap.className="detail";
  const img=document.createElement("img");
  img.src=coverOf(manga);
  img.alt=titleOf(manga);
  img.onerror=()=>img.removeAttribute("src");
  const info=document.createElement("div");
  const h=document.createElement("h1");
  h.textContent=titleOf(manga);
  const desc=document.createElement("p");
  const d=manga.attributes?.description||{};
  desc.textContent=d[state.language]||d.en||d.ru||Object.values(d)[0]||"Описание отсутствует.";
  const meta=document.createElement("p");
  meta.className="muted";
  meta.textContent=[manga.attributes?.status,manga.attributes?.year,manga.attributes?.originalLanguage].filter(Boolean).join(" · ");
  info.append(h,meta,desc);
  wrap.append(img,info);
  $("detail").append(wrap);
  await loadChapters();
 }catch(error){
  $("chapterStatus").textContent=error.message;
  log("ERROR "+error.message);
 }
}

async function loadChapters(){
 $("chapters").replaceChildren();
 $("chapterStatus").textContent="Запрос списка глав…";
 try{
  const result=await request(`/manga/${encodeURIComponent(state.mangaId)}/feed`,{
   limit:100,
   offset:0,
   "translatedLanguage[]":[chapterLanguage()],
   "order[volume]":"asc",
   "order[chapter]":"asc",
   includeExternalUrl:false
  });
  state.chapters=result.data||[];
  $("chapterStatus").textContent=`Получено глав: ${state.chapters.length}. Язык: ${chapterLanguage()}.`;
  state.chapters.forEach(chapter=>{
   const button=document.createElement("button");
   const a=chapter.attributes||{};
   button.textContent=[a.chapter?`Глава ${a.chapter}`:"Глава без номера",a.title].filter(Boolean).join(" — ");
   button.onclick=()=>openChapter(chapter);
   $("chapters").append(button);
  });
  if(!state.chapters.length)$("chapterStatus").textContent+=" Для этой манги нет глав на выбранном языке.";
 }catch(error){
  $("chapterStatus").textContent=error.message;
  log("ERROR "+error.message);
 }
}

async function openChapter(chapter){
 show("reader");
 $("pages").replaceChildren();
 $("readerTitle").textContent=`Глава ${chapter.attributes?.chapter||""} ${chapter.attributes?.title||""}`;
 $("readerStatus").textContent="Запрос данных MangaDex@Home…";
 try{
  const result=await request("/at-home/server/"+encodeURIComponent(chapter.id),{forcePort443:true});
  const data=result.chapter;
  const files=data?.dataSaver?.length?data.dataSaver:data?.data;
  const quality=data?.dataSaver?.length?"data-saver":"data";
  if(!result.baseUrl||!data?.hash||!files?.length)throw new Error("API не вернул данные страниц");
  $("readerStatus").textContent=`Страниц: ${files.length}. Качество: ${quality}.`;
  files.forEach((file,index)=>{
   const img=document.createElement("img");
   img.loading=index<2?"eager":"lazy";
   img.alt="Страница "+(index+1);
   img.src=`${result.baseUrl}/${quality}/${data.hash}/${encodeURIComponent(file)}`;
   img.onerror=()=>{img.alt="Не удалось загрузить страницу "+(index+1);log("IMAGE ERROR "+img.src)};
   $("pages").append(img);
  });
 }catch(error){
  $("readerStatus").textContent=error.message;
  log("ERROR "+error.message);
 }
}

$("searchBtn").onclick=()=>{
 state.search=$("search").value.trim();
 $("heading").textContent=state.search?"Результаты поиска":"Каталог манги";
 show("catalog");
 loadCatalog(true);
};
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")$("searchBtn").click()});
$("reload").onclick=()=>loadCatalog(true);
$("more").onclick=()=>loadCatalog(false);
$("language").onchange=()=>loadCatalog(true);
$("chapterLang").onchange=loadChapters;
$("back").onclick=()=>show("catalog");
$("readerBack").onclick=()=>show("detail");

state.language=detectLanguage();
loadCatalog(true);
</script>
</body>
</html>
